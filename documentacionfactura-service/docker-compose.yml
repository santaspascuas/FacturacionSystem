services:
  clientDocumentacion-db:
    image: postgres:17-alpine
    container_name: documentacion-product-db
    environment:
      POSTGRES_DB: ${DOCUMENTACION_DB_POSTGRES}
      POSTGRES_USER: ${DOCUMENTACION_DB_USER}
      POSTGRES_PASSWORD: ${DOCUMENTACION_DB_PASSWORD}
    ports:
      - "${DOCUMENTACION_DB_PORT}:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMENTACION_DB_USER} -d ${DOCUMENTACION_DB_POSTGRES}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  product-db-data: