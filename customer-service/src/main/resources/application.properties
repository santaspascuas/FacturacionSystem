spring.application.name=customer-service
spring.config.import=optional:file:.env[.properties]

# Puertos: 8080 api-gateway, 8081 auth-service, 8082 customer-service, 8083 product-service,
# 8084 documentacionfactura-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${CUSTOMER_DB_HOST:localhost}:${CUSTOMER_DB_PORT:55435}/${CUSTOMER_DB_POSTGRES:customer_db}
spring.datasource.username=${CUSTOMER_DB_USER:postgres}
spring.datasource.password=${CUSTOMER_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Logs
logging.level.com.facturacionAutonomo.customer_service=DEBUG