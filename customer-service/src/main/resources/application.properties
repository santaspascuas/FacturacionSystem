spring.application.name=customer-service
spring.config.import=optional:file:.env[.properties]

# 8080 es del api-gateway
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${CUSTOMER_DB_HOST:localhost}:${CUSTOMER_DB_PORT:55433}/${CUSTOMER_DB_POSTGRES:customer_db}
spring.datasource.username=${CUSTOMER_DB_USER:postgres}
spring.datasource.password=${CUSTOMER_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Logs
logging.level.com.facturacionAutonomo.customer_service=DEBUG