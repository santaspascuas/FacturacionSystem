services:
  customer-db:
    image: postgres:17-alpine
    container_name: facturacion-customer-db
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_POSTGRES}
      POSTGRES_USER: ${CUSTOMER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    ports:
      - "${CUSTOMER_DB_PORT}:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_DB_USER} -d ${CUSTOMER_DB_POSTGRES}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  customer-db-data:
