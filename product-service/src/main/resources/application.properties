spring.application.name=product-service
spring.config.import=optional:file:.env[.properties]
# Puertos: 8080 api-gateway, 8081 auth-service, 8082 customer-service, 8083 product-service,
# 8084 documentacionfactura-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:postgresql://${PRODUCT_DB_HOST:localhost}:${PRODUCT_DB_PORT:55433}/${PRODUCT_DB_POSTGRES:product_db}
spring.datasource.username=${CUSTOMER_DB_USER:postgres}
spring.datasource.password=${CUSTOMER_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Logs
logging.level.com.facturacionAutonomo.product_service=DEBUG