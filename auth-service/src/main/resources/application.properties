spring.application.name=auth-service
spring.profiles.default=dev

server.port=${SERVER_PORT:8081}
server.shutdown=graceful

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.jwt.issuer=facturacion-auth
app.security.jwt.audience=facturacion-api
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d
app.security.jwt.key-id=auth-key-1
app.security.jwt.private-key=${JWT_PRIVATE_KEY_PATH}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.root=INFO
